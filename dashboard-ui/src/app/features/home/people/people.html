@if (loading() || error()) {
<manga-service-notice
  [error]="error()"
  label="Finding readers…"
  (retry)="load()"
/>
} @else {
<div class="flex flex-col gap-3">
  @for (reader of readers(); track reader.username) {
  <article class="person-card">
    <a
      routerLink="/home"
      [queryParams]="{ tab: 'library', user: reader.username }"
      class="flex min-w-0 flex-1 items-center gap-3"
      ><span class="avatar" [style.background]="reader.color"
        >{{ reader.name.slice(0, 1) }}</span
      >
      <div class="min-w-0">
        <h3 class="font-medium">{{ reader.name }}</h3>
        <p class="text-xs text-slate-400">{{ "@" + reader.username }}</p>
        <p class="mt-2 text-sm text-slate-400">{{ reader.bio }}</p>
      </div></a
    ><button
      [class]="followed(reader) ? 'action-secondary' : 'action-primary'"
      [attr.aria-pressed]="followed(reader)"
      (click)="store.toggleFollow(reader.username)"
    >
      {{ followed(reader) ? "Following" : "Follow" }}
    </button>
  </article>
  } @empty {
  <p class="empty-state">No readers found. Try another name or username.</p>
  }
</div>
}
