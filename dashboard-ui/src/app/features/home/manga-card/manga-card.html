<div
  class="cover-art"
  [style.background-image]="cover()"
  role="img"
  [attr.aria-label]="manga().title + ' cover'"
>
  <span class="cover-status">{{ manga().status }}</span>
</div>
<div class="p-3 flex flex-col gap-2">
  <h3 class="font-semibold text-sm">{{ manga().title }}</h3>
  <p class="text-xs text-slate-400">{{ manga().authors.join(", ") }}</p>
  <p class="text-xs text-orange-200">
    {{ manga().genres.slice(0, 2).join(" · ") }}
  </p>
  <p class="text-xs text-slate-400 line-clamp-2">{{ manga().description }}</p>
  <manga-actions [manga]="manga()" />
</div>
